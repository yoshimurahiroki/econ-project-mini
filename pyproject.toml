[project]
name = "econ-project"
version = "0.1.0"
description = "Minimal infrastructure stack for Python, R, TinyTeX, Quarto, and Jupyter"
requires-python = ">=3.12"
authors = [{ name = "yoshimurahiroki", email = "yoshimurahiroki@akane.waseda.jp" }]
dependencies = []

# ── Pixi configuration ──────────────────────────────────────────
# Use wildcard specs so Pixi resolves the latest compatible versions available
# from the configured channel. Analysis libraries are intentionally not listed.
[tool.pixi.workspace]
name = "econ-project"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
# Python runtime
python = "*"
pip = "*"
setuptools = "*"
wheel = "*"

# Jupyter Notebook / JupyterLab infrastructure
jupyterlab = "*"
notebook = "*"
jupyter_server = "*"
ipykernel = "*"
ipywidgets = "*"
nbclient = "*"
nbformat = "*"
pyzmq = "*"

# R runtime and Jupyter kernel infrastructure
r-base = "*"
r-irkernel = "*"
r-languageserver = "*"

# Quarto / R Markdown / TeX integration infrastructure
quarto = "*"
pandoc = "*"
deno = "*"
typst = "*"
esbuild = "*"
dart-sass = "*"
r-rmarkdown = "*"
r-knitr = "*"
r-tinytex = "*"
r-yaml = "*"

[tool.pixi.pypi-dependencies]
# Intentionally empty. Add project-specific PyPI packages only when an analysis
# actually needs them.

[tool.pixi.tasks]
python-version = "python --version"
r-version = "R --version"
jupyter-lab = "jupyter lab --ip=0.0.0.0 --no-browser"
jupyter-notebook = "jupyter notebook --ip=0.0.0.0 --no-browser"
quarto-check = "quarto check"
install-python-kernel = "python -m ipykernel install --user --name econ-project --display-name 'Python (econ-project)'"
install-r-kernel = "R -q -e 'IRkernel::installspec(user = TRUE, name = \"ir\", displayname = \"R (econ-project)\")'"
