repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-correctness
        name: Ruff correctness (changed Python)
        entry: pixi run -e quality ruff check --select E9,F63,F7,F82 --force-exclude
        language: system
        types: [python]
      - id: mypy-boundaries
        name: mypy (adopted typed boundaries)
        entry: pixi run -e quality mypy
        language: system
        files: ^scripts/build_latex\.py$
      - id: shellcheck
        name: ShellCheck (changed shell)
        entry: pixi run -e quality shellcheck --severity=warning
        language: system
        types: [shell]
