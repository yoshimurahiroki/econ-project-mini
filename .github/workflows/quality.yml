name: Selected changed-behavior checks

'on':
  push:
    branches: [ers-writing-export-20261107]
    paths: [.github/workflows/quality.yml]
  workflow_dispatch:
    inputs:
      base:
        description: Compare changed paths with this commit or branch
        required: true
        default: origin/main
        type: string
      check:
        description: Existing check with a remaining evidence gap
        required: true
        default: all
        type: choice
        options:
          - all
          - syntax
          - lint
          - typecheck
          - tests
          - registry
          - distribution
      test:
        description: Optional exact existing pytest node, replacing changed-path selection
        required: false
        type: string

permissions:
  contents: read

jobs:
  selected-checks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - if: inputs.test != '' || inputs.check == 'tests' || inputs.check == 'all'
        run: python -m pip install pytest==9.1.1
      - if: inputs.test == '' && (inputs.check == 'lint' || inputs.check == 'all')
        run: python -m pip install ruff
      - if: inputs.test == '' && (inputs.check == 'typecheck' || inputs.check == 'all')
        run: python -m pip install mypy
      - name: Execute selected existing checks
        env:
          SELECTED_TEST: ${{ inputs.test }}
          CHECK_BASE: ${{ inputs.base }}
          CHECK_KIND: ${{ inputs.check }}
        run: |
          if [ -n "$SELECTED_TEST" ]; then
            make test "TEST=$SELECTED_TEST" 'PIXI_RUN=python -m'
          else
            python harness/local_checks.py check-changed --base "$CHECK_BASE" --check "$CHECK_KIND"
          fi
  writing-source-export:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ers-writing-export-20261107'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ea176844d38da4d520490e27e2815e6d8980aed3
          persist-credentials: false
      - name: Archive the selected public source
        run: |
          mkdir -p "$RUNNER_TEMP/ers-writing-source"
          git rev-parse HEAD > "$RUNNER_TEMP/ers-writing-source/source-sha.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/ers-writing-source/source.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/ers-writing-source/source.tar.gz" > "$RUNNER_TEMP/ers-writing-source/archive-sha256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ers-writing-source-ea176844
          path: ${{ runner.temp }}/ers-writing-source/
          if-no-files-found: error
          retention-days: 1
