name: Simplify project once
on:
  push:
    branches: ['agent/simple-project']
    paths: ['.github/workflows/simplify-once.yml', 'scripts/_simplify_once.py']
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply requested cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/_simplify_once.py
